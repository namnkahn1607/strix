version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/gateway"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
